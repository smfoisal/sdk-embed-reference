<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flarie Studio (embed)</title>
    <!--
      Stand-in for the real Studio embed shell (the single-spa root config in
      "embed mode"). It shows the CHILD side of the postMessage protocol:
      ready -> receive init (token + theme) -> call API with Bearer token ->
      report height / navigation / events back to the partner page.
    -->
    <style>
      :root {
        --flarie-color-primary: #2b59c3;
        --flarie-color-on-primary: #fff;
        --flarie-color-surface: #fff;
        --flarie-color-background: #f5f6f8;
        --flarie-color-text: #1a1d24;
        --flarie-color-text-muted: #5e6573;
        --flarie-color-border: #dde1e8;
        --flarie-font-family-body: system-ui, sans-serif;
        --flarie-font-family-heading: system-ui, sans-serif;
        --flarie-font-size-base: 14px;
        --flarie-border-radius: 8px;
        --flarie-button-radius: 8px;
        --flarie-input-radius: 8px;
        --flarie-focus-ring: rgb(43 89 195 / 0.45);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        font-family: var(--flarie-font-family-body);
        font-size: var(--flarie-font-size-base);
        line-height: 1.5;
        color: var(--flarie-color-text);
        background: var(--flarie-color-surface);
      }
      button, input, select { font: inherit; }
      :focus-visible { outline: 3px solid var(--flarie-focus-ring); outline-offset: 2px; }
      .bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--flarie-color-border); }
      .bar h1 { margin: 0; font-family: var(--flarie-font-family-heading); font-size: 1.15em; flex: 1; }
      .where { color: var(--flarie-color-text-muted); font-size: 0.9em; }
      .btn { border: 1px solid transparent; border-radius: var(--flarie-button-radius); padding: 8px 14px; font-weight: 600; cursor: pointer; }
      .btn-primary { background: var(--flarie-color-primary); color: var(--flarie-color-on-primary); }
      .btn-ghost { background: transparent; color: var(--flarie-color-primary); }
      .body { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(260px, 1.2fr); gap: 24px; padding: 20px 16px 24px; }
      .panel { display: grid; gap: 14px; align-content: start; }
      .panel h2 { margin: 0; font-family: var(--flarie-font-family-heading); font-size: 1em; }
      label { display: grid; gap: 6px; font-weight: 600; }
      input, select { font-weight: 400; padding: 8px 10px; border: 1px solid var(--flarie-color-border); border-radius: var(--flarie-input-radius); background: var(--flarie-color-surface); color: var(--flarie-color-text); }
      .saved { color: var(--flarie-color-text-muted); min-height: 1.5em; margin: 0; }
      .preview { display: grid; place-items: center; padding: 20px; border-radius: var(--flarie-border-radius); background: var(--flarie-color-background); }
      .phone { width: 250px; padding: 22px 18px; border-radius: 26px; background: var(--flarie-color-surface); border: 1px solid var(--flarie-color-border); display: grid; gap: 12px; }
      .phone h3 { margin: 0; font-family: var(--flarie-font-family-heading); font-size: 1.05em; }
      .q { margin: 0; color: var(--flarie-color-text-muted); }
      .answer { border: 1px solid var(--flarie-color-border); border-radius: var(--flarie-button-radius); padding: 9px 12px; }
      .answer.is-picked { border-color: var(--flarie-color-primary); background: color-mix(in srgb, var(--flarie-color-primary) 10%, transparent); font-weight: 600; }
      .target { margin: 0; font-size: 0.9em; color: var(--flarie-color-text-muted); }
      .waiting { padding: 32px 16px; color: var(--flarie-color-text-muted); }
      @media (max-width: 620px) { .body { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app"><p class="waiting">Connecting to the partner page…</p></div>

    <script>
      // Injected by the server from Partner Management (same list as CSP frame-ancestors).
      const ALLOWED_PARENTS = __ALLOWED_PARENTS__;
      const V = 1;
      let parentOrigin = null;
      let token = null;
      let pendingToken = null;
      let currentGame = null;

      function send(msg) {
        if (parentOrigin) window.parent.postMessage({ source: 'flarie-studio', v: V, ...msg }, parentOrigin);
      }

      // "ready" carries no data, and is only delivered to allowed partner origins.
      for (const origin of ALLOWED_PARENTS) {
        window.parent.postMessage({ source: 'flarie-studio', v: V, type: 'ready' }, origin);
      }

      window.addEventListener('message', (e) => {
        if (e.source !== window.parent || !ALLOWED_PARENTS.includes(e.origin)) return;
        const m = e.data;
        if (m?.source !== 'flarie-host' || m.v !== V) return;
        parentOrigin = e.origin;

        if (m.type === 'init') { token = m.token; applyTokens(m.tokens); route(m.path); }
        if (m.type === 'token') { token = m.token; pendingToken?.(m.token); pendingToken = null; }
        if (m.type === 'theme') applyTokens(m.tokens);
        if (m.type === 'navigate') route(m.path);
      });

      function applyTokens(tokens) {
        for (const [name, value] of Object.entries(tokens)) document.documentElement.style.setProperty(name, value);
      }

      // Same-origin API call with the handed-over Bearer token. No cookies involved.
      async function api(path, retried = false) {
        const res = await fetch(`/flarie-api${path}`, { headers: { Authorization: `Bearer ${token}` } });
        if (res.status === 401 && !retried) {
          token = await new Promise((resolve) => { pendingToken = resolve; send({ type: 'token-request' }); });
          return api(path, true);
        }
        return res.json();
      }

      async function route(path) {
        const match = path.match(/^\/games\/([^/]+)\/edit$/);
        if (!match) return renderMessage(`Nothing to show for ${path}`);
        const games = await api('/games');
        currentGame = games.find((g) => g.id === match[1]);
        if (!currentGame) return renderMessage('This game no longer exists.');
        renderEditor(path);
      }

      function renderMessage(text) {
        document.getElementById('app').innerHTML = '<p class="waiting"></p>';
        document.querySelector('.waiting').textContent = text;
        reportHeight();
      }

      function renderEditor(path) {
        const app = document.getElementById('app');
        app.innerHTML = `
          <div class="bar">
            <button class="btn btn-ghost" id="back" type="button">Back to games</button>
            <h1 id="title"></h1>
            <span class="where"></span>
          </div>
          <div class="body">
            <form class="panel" id="form">
              <h2>Settings</h2>
              <label>Name <input id="name" /></label>
              <label>Challenge target score <input id="target" type="number" min="0" step="10" value="80" /></label>
              <label>Reward
                <select id="reward"><option>50 points</option><option>Free coffee</option><option>No reward</option></select>
              </label>
              <div><button class="btn btn-primary" type="submit">Save changes</button></div>
              <p class="saved" id="saved" role="status"></p>
            </form>
            <div class="preview" aria-label="Game preview">
              <div class="phone">
                <h3 id="p-name"></h3>
                <p class="q">Which country grows the most coffee?</p>
                <div class="answer">Colombia</div>
                <div class="answer is-picked">Brazil</div>
                <div class="answer">Vietnam</div>
                <p class="target" id="p-target"></p>
              </div>
            </div>
          </div>`;
        app.querySelector('#title').textContent = currentGame.name;
        app.querySelector('.where').textContent = `Iframe path: ${path}`;
        const name = app.querySelector('#name');
        const target = app.querySelector('#target');
        name.value = currentGame.name;
        const sync = () => {
          app.querySelector('#p-name').textContent = name.value || 'Untitled game';
          app.querySelector('#p-target').textContent = `Score ${target.value} to unlock the reward`;
        };
        name.addEventListener('input', sync);
        target.addEventListener('input', sync);
        sync();
        app.querySelector('#back').addEventListener('click', () => send({ type: 'navigate', path: '/games' }));
        app.querySelector('#form').addEventListener('submit', (e) => {
          e.preventDefault();
          app.querySelector('#saved').textContent = 'Changes saved';
          send({ type: 'event', event: { type: 'game.updated', data: { id: currentGame.id } } });
        });
        reportHeight();
      }

      // Measure the content, not the document: documentElement.scrollHeight is
      // never smaller than the iframe itself, so the frame could only grow.
      function reportHeight() {
        send({ type: 'resize', height: document.getElementById('app').getBoundingClientRect().height });
      }
      new ResizeObserver(reportHeight).observe(document.getElementById('app'));
    </script>
  </body>
</html>
